server.port=${SERVER_PORT:8089}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbpurchase}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Set a strong random secret (at least 32 UTF-8 bytes) in IMS_JWT_SECRET.
ims.jwt.secret=${IMS_JWT_SECRET:}
ims.jwt.expiration-ms=${IMS_JWT_EXPIRATION_MS:3600000}

# Redis cache
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Kafka purchase-created event
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.template.default-topic=ims.purchase.created

MaterialServiceConsumer.serviceURL=${MATERIAL_SERVICE_URL:http://localhost:8088}
MaterialCategoryConsumer.apiURL=/material/controller/getMaterialCategories
MaterialCategoryConsumer.apiURLForById=/material/controller/getMaterialCategoryById/
MaterialTypeConsumer.apiURL=/type/controller/getTypeDetails
MaterialTypeConsumer.apiURLByCategoryId=/type/controller/getTypeDetailsByCategoryId/
UnitServiceConsumer.apiURL=/unit/controller/getUnitDetails
UnitServiceConsumer.apiURLByCategoryId=/unit/controller/getUnitsByCategoryId/
VendorServiceConsumer.serviceURL=${VENDOR_SERVICE_URL:http://localhost:8087/vendor}
VendorServiceConsumer.apiURL=/controller/getVendors
